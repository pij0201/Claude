<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Local Trip</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topbar">
    <h1 class="logo">🧭 Local Trip</h1>
    <button id="langToggle" class="lang-toggle" type="button">EN</button>
  </header>

  <main>
    <section class="panel">
      <div class="field-row">
        <div class="field">
          <label for="sidoSelect" data-i18n="labelSido">지역 (시/도)</label>
          <select id="sidoSelect"></select>
        </div>
        <div class="field">
          <label for="sigunguSelect" data-i18n="labelSigungu">세부 지역 (선택)</label>
          <select id="sigunguSelect">
            <option value="" data-i18n="optAll">전체</option>
          </select>
        </div>
      </div>
      <button id="discoverBtn" class="link-btn" type="button">
        🎲 <span data-i18n="discoverNew">아직 안 가본 지역 추천받기</span>
      </button>

      <div class="field">
        <label data-i18n="labelCategory">관심 카테고리</label>
        <div id="categoryChips" class="chips"></div>
      </div>

      <button id="recommendBtn" class="primary-btn" type="button" data-i18n="getRecommend">
        추천받기
      </button>
    </section>

    <section id="summarySection" class="summary hidden">
      <p id="regionSummary"></p>
    </section>

    <section id="resultsSection" class="results"></section>

    <section id="stateSection" class="state hidden">
      <p id="stateMessage"></p>
    </section>
  </main>

  <div id="detailModal" class="modal hidden">
    <div class="modal-content">
      <button id="modalClose" class="modal-close" type="button">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
